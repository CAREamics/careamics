# enable pre-commit.ci at https://pre-commit.ci/
# it adds:
# 1. auto fixing pull requests
# 2. auto updating the pre-commit configuration
ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "style(pre-commit.ci): auto fixes [...]"
  autoupdate_commit_msg: "ci(pre-commit.ci): autoupdate"
  # pyrefly needs the uv project env, skipping
  skip: [pyrefly-check]

repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        exclude: "^(docs/.*|src/careamics/lvae_training/.*|src/careamics/models/lvae/.*|scripts/.*|demos/.*)"

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        exclude: "^src/careamics/careamist.py"

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.1.1
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        language: system  # use the installed pyrefly
        pass_filenames: false  # full-repo check

  # check docstrings
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0rc0
    hooks:
      - id: numpydoc-validation
        exclude: "^(tests/.*|docs/.*|src/careamics/lvae_training/.*|src/careamics/models/lvae/.*|src/careamics/losses/lvae/.*|scripts/.*)"
        # data_module: overloads and config params (val_percentage etc.) don't match signature; see https://github.com/numpy/numpydoc/issues/559

  # # jupyter linting and formatting
  # - repo: https://github.com/nbQA-dev/nbQA
  #   rev: 1.8.5
  #   hooks:
  #     - id: nbqa-ruff
  #       args: [--fix]
  #     - id: nbqa-black
  #     #- id: nbqa-mypy

  # strip out jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
