name: CI-cli

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    # run every week (for --pre release tests)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: CLI py3.13 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.0"
          enable-cache: true
          python-version: "3.13"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: 🧪 Run CLI tests
        run: uv run pytest tests/cli --color=yes
